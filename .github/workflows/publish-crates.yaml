name: Publish to crates.io

on:
  release:
    types: [published]

env:
  CARGO_TERM_COLOR: always

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
          submodules: recursive

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Verify Cargo.toml version matches the release tag
        run: |
          TAG="${{ github.event.release.tag_name }}"
          CARGO_VERSION=$(grep -oP '^version\s*=\s*"\K[^"]+' Cargo.toml | head -1)
          if [ "v$CARGO_VERSION" != "$TAG" ]; then
            echo "::error::Cargo.toml says $CARGO_VERSION but the release tag is $TAG"
            exit 1
          fi
          echo "Version $CARGO_VERSION matches tag $TAG"

      - name: Verify package contents
        run: |
          cargo package --list
          echo "---"
          echo "Verifying proto files are included..."
          cargo package --list | grep -q "proto/data.proto" || { echo "::error::proto/data.proto missing from package!"; exit 1; }
          cargo package --list | grep -q "proto/disciplines.proto" || { echo "::error::proto/disciplines.proto missing from package!"; exit 1; }

      - name: Publish to crates.io
        run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
