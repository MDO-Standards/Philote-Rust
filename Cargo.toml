[package]
name = "philote"
version = "0.1.0"
edition = "2021"

[lib]
name = "philote"
path = "src/lib.rs"
crate-type = ["rlib"]
bench = false


[dependencies]
ndarray = "0.16"
ndarray-linalg = { version = "0.16", optional = true }
prost = "0.13"
prost-types = "0.13"
tokio = { version = "1.0", features = ["macros", "rt-multi-thread"] }
tokio-stream = "0.1"
tonic = "0.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
tracing = "0.1"
async-trait = "0.1"

[build-dependencies]
tonic-build = "0.12"

[features]
default = []
linalg = ["ndarray-linalg"]

[[example]]
name = "paraboloid"
path = "examples/paraboloid.rs"
