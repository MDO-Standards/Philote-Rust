[package]
name = "philote-mdo"
version = "0.0.0"
edition = "2021"
description = "A Rust library for building MDO analysis discipline servers using the Philote gRPC standard"
license = "Apache-2.0"
repository = "https://github.com/chrislupp/Philote-Rust"
homepage = "https://github.com/chrislupp/Philote-Rust"
documentation = "https://docs.rs/philote-mdo"
readme = "README.md"
keywords = ["mdo", "grpc", "engineering", "optimization", "multidisciplinary"]
categories = ["science", "simulation"]
include = [
    "src/**/*",
    "examples/**/*",
    "tests/**/*",
    "proto/data.proto",
    "proto/disciplines.proto",
    "build.rs",
    "Cargo.toml",
    "LICENSE",
    "README.md",
    "CHANGELOG.md",
]

[lib]
name = "philote_mdo"
path = "src/lib.rs"
crate-type = ["rlib"]
bench = false


[dependencies]
ndarray = "0.16"
prost = "0.13"
prost-types = "0.13"
tokio = { version = "1.0", features = ["macros", "rt-multi-thread"] }
tokio-stream = "0.1"
tokio-util = { version = "0.7", features = ["rt"] }
futures-util = "0.3"
tonic = "0.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
tracing = "0.1"
async-trait = "0.1"

[build-dependencies]
tonic-build = "0.12"

[features]
default = []

[[example]]
name = "paraboloid"
path = "examples/paraboloid.rs"

[[example]]
name = "client_example"
path = "examples/client_example.rs"

[[example]]
name = "server_runner"
path = "examples/server_runner.rs"
